[package]
name = "taskforce"
version = "0.1.0"
description = "A visual completion signal for coding agents"
authors = ["Taskforce contributors"]
edition = "2021"

[lib]
name = "taskforce_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2"
tiny_http = "0.12.0"
uuid = { version = "1", features = ["v4"] }
